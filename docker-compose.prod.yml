version: '3.8'

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: answerdeck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-storage:/data
    networks:
      - answerdeck-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: answerdeck-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-answerdeckkey}
    networks:
      - answerdeck-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: answerdeck-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-answerdeckkey}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://frontend:3000}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - qdrant
      - redis
    networks:
      - answerdeck-network
    command: python main.py
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: answerdeck-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - backend
    networks:
      - answerdeck-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: answerdeck-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - answerdeck-network
    restart: unless-stopped

volumes:
  qdrant-storage:
    driver: local
  redis-storage:
    driver: local

networks:
  answerdeck-network:
    driver: bridge
